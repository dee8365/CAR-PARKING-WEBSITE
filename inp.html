<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Parking System - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">ParkEasy</div>
    <div class="nav-links">
      <a href="landing.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="C:\Users\Deepro Nawn\New folder\registration\tic-tac-toe\dashboard..html">Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h2>User Login</h2>
      <p class="subtitle">Enter your credentials to access the parking dashboard.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
          <div class="hint">Must contain at least 6 characters, 1 uppercase letter, and 1 number.</div>
        </div>

        <div id="errorMessage" class="error-msg"></div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
    </div>
  </div>

  <script src="check.js"></script>
</body>
</html>
